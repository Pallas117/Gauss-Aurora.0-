display_information:
  name: Gauss
  description: Sovereign repo, agent, and radiation-event operations assistant
  background_color: "#050505"
features:
  bot_user:
    display_name: gauss
    always_online: false
  slash_commands:
    - command: /gauss
      description: Inspect Gauss repo and agent status
      usage_hint: "status | agents | radiation | help"
      should_escape: false
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: true
