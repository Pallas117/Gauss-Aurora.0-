# Gauss bxr stack: Kafka, Redis, InfluxDB, PostgreSQL
# For M1 8GB: resource limits applied. Start with: docker compose up -d
# Required for: Ingest Gateway, Feed/API, C++ Telemetry Service, Command Log, OpenMCT adapter

services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    container_name: gauss-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gauss-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 320M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  influxdb:
    image: influxdb:2.7-alpine
    container_name: gauss-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: gauss-influx-admin
      DOCKER_INFLUXDB_INIT_ORG: gauss
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: gauss-influx-admin-token
    volumes:
      - influxdb-data:/var/lib/influxdb2
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: gauss-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: gauss
      POSTGRES_PASSWORD: gauss-pg
      POSTGRES_DB: gauss
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/command-log/migrations/001_command_log.sql:/docker-entrypoint-initdb.d/001_command_log.sql:ro
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gauss -d gauss"]
      interval: 5s
      timeout: 3s
      retries: 5

  telemetry-processor:
    build:
      context: services/telemetry-processor
      dockerfile: Dockerfile
    container_name: gauss-telemetry-processor
    environment:
      KAFKA_BROKERS: kafka:9092
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: gauss-influx-admin-token
      INFLUXDB_ORG: gauss
      INFLUXDB_BUCKET: telemetry
    depends_on:
      kafka: { condition: service_healthy }
      influxdb: { condition: service_healthy }
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  influxdb-data:
  postgres-data:
