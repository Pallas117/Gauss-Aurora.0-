[package]
name = "gauss-orchestrator"
version = "0.1.0"
edition = "2021"
authors = ["Gauss Team"]
description = "Sovereign AI Orchestrator: High-performance, low-RAM automation engine for telemetry routing"
readme = "README.md"

[dependencies]
regex = "1.11"
sha2 = "0.10"
tokio = { version = "1.35", features = ["full"] }
notify = "6.1"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.7", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
anyhow = "1.0"
lazy_static = "1.4"
uuid = { version = "1.11", features = ["v4", "serde"] }
teloxide = { version = "0.12", features = ["macros", "auto-send"] }
base64 = "0.21"

[dev-dependencies]
tempfile = "3"
tokio-test = "0.4"
wiremock = "0.5"
proptest = "1.4"
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
